name: proovit_capture
description: Native Android CameraX capture with ProovIT capture.v1 signing and SDK receipts.
version: 0.1.0-beta.4
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: io.proovit.capture.flutter
        pluginClass: ProovitCapturePlugin
