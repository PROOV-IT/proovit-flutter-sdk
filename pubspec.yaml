name: proovit_capture
description: Beta Android CameraX capture with PROOV-IT signed receipts.
version: 0.1.0-beta.11
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: io.proovit.capture.flutter
        pluginClass: ProovitCapturePlugin
