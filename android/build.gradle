plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'io.proovit.capture.flutter'
version = '0.1.0-beta.7'

android {
    namespace 'io.proovit.capture.flutter'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}

// capture-core is embedded as a deterministic source snapshot by
// scripts/export-flutter-sdk.sh. This keeps the Flutter plugin self-contained:
// host applications do not add a Gradle project or private Maven repository.
android.sourceSets.main.java.srcDirs += 'capture-core/src/main/kotlin'
android.sourceSets.main.res.srcDirs += 'capture-core/src/main/res'
